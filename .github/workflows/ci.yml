name: CI

on:
  push:
  pull_request:

# Least privilege for the workflow token; a newer push to the same branch cancels the older run.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Staff portal only. The public website and the Laravel API live in the Road-trip-web repo.
env:
  NODE_VERSION: 24
  PNPM_VERSION: 12.16.1
  PHP_VERSION: '8.3'

jobs:
  checks:
    name: Lint, types, unit tests, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:unit
      - run: pnpm build-only
      - run: pnpm audit --prod

  e2e:
    name: E2E against the Laravel API (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: checks
    # WebKit reports but does not block until its first green run (see the public website's CI), then remove this.
    continue-on-error: ${{ matrix.project == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    # The API lives in Road-trip-web; it is checked out beside this repo only to run the backend.
    # If that repo is private, add a WEB_REPO_TOKEN secret with read access.
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['54322:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ['54324:8025', '54325:1025']
    steps:
      - uses: actions/checkout@v4
        with: { path: admin }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Road-trip-web
          path: web
          token: ${{ secrets.WEB_REPO_TOKEN || github.token }}
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', extensions: 'pdo_pgsql, pgsql, gd, intl, bcmath', coverage: none }
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: API and isolated E2E database
        working-directory: web
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 24)/; s/^DB_MIGRATION_PASSWORD=.*/DB_MIGRATION_PASSWORD=$(openssl rand -hex 24)/" .env
          sh scripts/setup-local-db.sh
          DB_DATABASE=myridenepal_e2e php artisan migrate --database=pgsql_owner --force
          DB_DATABASE=myridenepal_e2e php artisan db:seed --force
      - working-directory: admin
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps ${{ matrix.project }}
          pnpm test:e2e --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: 'playwright-traces-${{ matrix.project }}', path: admin/test-results, retention-days: 7 }

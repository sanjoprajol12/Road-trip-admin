name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: 24
  PNPM_VERSION: 12.16.1
  PHP_VERSION: '8.3'

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint (no autofix)
        run: pnpm exec oxlint . && pnpm exec eslint .
      - run: pnpm type-check
      - run: pnpm test:unit
      - run: pnpm build-only
      - run: pnpm audit --prod

  e2e:
    name: E2E against the Laravel API
    runs-on: ubuntu-latest
    needs: checks
    # The API lives in Road-trip-web; it is checked out beside this repo only to run the backend.
    # If that repo is private, add a WEB_REPO_TOKEN secret with read access.
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['54322:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { path: admin }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Road-trip-web
          path: web
          token: ${{ secrets.WEB_REPO_TOKEN || github.token }}
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', extensions: 'pdo_pgsql, pgsql, gd, intl, bcmath', coverage: none }
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Backend
        working-directory: web
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 24)/; s/^DB_MIGRATION_PASSWORD=.*/DB_MIGRATION_PASSWORD=$(openssl rand -hex 24)/; s/^MAIL_MAILER=.*/MAIL_MAILER=log/" .env
          sh scripts/setup-local-db.sh
          php artisan migrate --database=pgsql_owner --force
          php artisan db:seed --force
      - working-directory: admin
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium firefox webkit && pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: admin/test-results, retention-days: 7 }
